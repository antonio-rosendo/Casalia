<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casalia · Spanish house price forecasts</title>
  <meta name="description" content="12-month forecasts of the appraised price per m² in every Spanish region, backtested over 16 years and published before the outcome is known." />
  <meta name="author" content="Antonio Rosendo" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://antonio-rosendo.github.io/Casalia/" />

  <!-- Link previews (LinkedIn, Slack...): crawlers don't run JavaScript, so this is static. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://antonio-rosendo.github.io/Casalia/" />
  <meta property="og:title" content="Casalia · Spanish house price forecasts you can check" />
  <meta property="og:description" content="12-month forecasts for every Spanish region, backtested over 16 years and published before the outcome is known." />
  <meta property="og:image" content="https://antonio-rosendo.github.io/Casalia/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <script>
    // Apply a saved dark theme before the first paint.
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
